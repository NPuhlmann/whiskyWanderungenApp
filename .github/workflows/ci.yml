name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# CI only reads the repo. The one step that writes (SARIF upload) declares its
# own job-level permissions.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with distribute.yml. GitHub has no cross-workflow env sharing,
  # and a composite action for one string is not worth the indirection.
  FLUTTER_VERSION: '3.41.7'

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Prepare dotenv (CI uses .env.example template)
        run: cp .env.example .env

      - name: Cache pub dependencies and build_runner output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool/build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        # --delete-conflicting-outputs: a restored but stale .dart_tool/build
        # cache otherwise aborts the build hard.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify checked-in generated code is current
        # 69 .g.dart/.freezed.dart/.mocks.dart files are committed. Without this
        # a stale one passes CI silently, because the step above regenerates
        # over it. Measured clean on 2026-07-19.
        run: git diff --exit-code

      - name: Analyze code (lib/ strict; test/ scope in analysis_options.yaml)
        # Not --fatal-infos yet: one deprecated_member_use info remains in
        # lib/UI/.../waypoint_management_widget.dart. Arm it once that is gone.
        run: flutter analyze

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run critical tests
        # Explicit include list, not the full suite (assertion failures under
        # the #46-#51 burn-down). Fix a file, add it here and drop its exclude
        # in analysis_options.yaml, to grow coverage incrementally.
        run: >
          flutter test
          test/widget_test.dart
          test/data/services/auth_service_test.dart
          test/data/repositories/profile_repository_test.dart
          test/data/repositories/offline_first_waypoint_repository_test.dart
          test/UI/hike_details/hike_details_view_model_test.dart
          test/UI/checkout/checkout_view_model_test.dart
          test/UI/mobile/home/home_page_test.dart
          test/UI/mobile/home/home_view_model_test.dart
          test/UI/my_hikes/my_hikes_view_model_test.dart
          test/data/providers/route_management_provider_test.dart
          test/data/repositories/review_repository_test.dart
          test/data/repositories/user_repository_test.dart
          test/data/services/backend_api_payment_extension_simple_test.dart
          test/data/services/location/location_service_test.dart
          test/UI/core/scaffold_with_navigation_bar_test.dart
          test/UI/mobile/home/widgets/hike_card_test.dart
          test/UI/mobile/payment/order_history_view_model_test.dart
          test/UI/shared/responsive_layout_test.dart
          test/UI/web/admin/commission_management/widgets/commission_status_chip_test.dart

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fail on CRITICAL/HIGH findings
        # The SARIF run above only reports; this one blocks. Measured
        # 2026-07-19 with trivy 0.72: zero findings across pubspec.lock,
        # ios/ and macos/ Podfile.lock and docs/requirements.txt.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Prepare dotenv
        run: cp .env.example .env

      - name: Cache pub dependencies and build_runner output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool/build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build Android App Bundle
        run: flutter build appbundle --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab

  build-ios:
    name: iOS Build
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Prepare dotenv
        run: cp .env.example .env

      - name: Cache pub dependencies and build_runner output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool/build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-debug-build
          path: build/ios/

  build-web:
    name: Web Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Prepare dotenv
        run: cp .env.example .env

      - name: Cache pub dependencies and build_runner output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool/build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web (admin entry)
        # lib/main.dart is the mobile entry; lib/main_web.dart is the admin
        # entry that actually exercises lib/UI/web/** in the compile graph.
        run: flutter build web --target lib/main_web.dart

      - name: Upload Web build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: build/web/
