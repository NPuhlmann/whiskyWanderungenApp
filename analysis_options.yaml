# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code — we do not hand-edit these.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "lib/config/l10n/app_localizations*.dart"
    # Test suite remains excluded under the burn-down tracked in #46-#51.
    # Measured 2026-07-19: the whole tree COMPILES — `flutter test` reports
    # 1078 pass / 152 fail with zero load errors. The failures are assertion
    # failures, not the signature drift this exclude list was created for.
    # The two files that did not compile were deleted under #46. What is
    # left here is excluded out of caution, not necessity.
    # Only the CI-critical test files (see ci.yml) plus their shared mocks
    # and helpers are analyzed. Fix a file, drop its exclude here and add it
    # to the CI include list, to grow coverage incrementally.
    - "test/config/routing/payment_routes_test.dart"
    - "test/config/routing/auth_redirect_test.dart"
    - "test/data/providers/route_management_provider_simple_test.dart"
    - "test/data/providers/analytics_provider_test.dart"
    - "test/data/providers/order_management_provider_test.dart"
    - "test/data/providers/whisky_management_provider_test.dart"
    - "test/data/providers/team_provider_test.dart"
    - "test/data/providers/dashboard_provider_simple_test.dart"
    - "test/data/providers/commission_provider_test.dart"
    - "test/data/repositories/hike_images_repository_test.dart"
    - "test/data/repositories/notification_repository_test.dart"
    - "test/data/services/admin/**"
    - "test/data/services/analytics/**"
    - "test/data/services/auth_service_simple_test.dart"
    - "test/data/services/backend_api_simple_test.dart"
    - "test/data/services/commission/**"
    - "test/data/services/hike_service_test.dart"
    - "test/data/services/multi_payment_service_test.dart"
    - "test/data/services/multi_payment_simple_test.dart"
    - "test/data/services/notifications/**"
    - "test/data/services/offline/**"
    - "test/data/services/workflow/**"
    - "test/domain/**"
    - "test/integration/**"
    - "test/repositories/**"
    - "test/run_all_tests.dart"
    - "test/UI/auth/**"
    - "test/UI/checkout/checkout_page_test.dart"
    - "test/UI/navigation/**"
    - "test/UI/orders/**"
    - "test/UI/profile/**"
    - "test/UI/shared/guards/admin_guard_test.dart"
    - "test/UI/tasting_sets/**"
    - "test/UI/web/**"
  errors:
    # .env is created locally from .env.example (flutter_dotenv). assets/icons/
    # is a placeholder; reintroduce files before re-tightening this to warning.
    asset_does_not_exist: info
    asset_directory_does_not_exist: info

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
